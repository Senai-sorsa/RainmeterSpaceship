[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Spaceship
OnRefreshAction=[!Move "#OriginX#" "#OriginY#"][!ZPos -2][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
ContextTitle=Control Center
ContextAction=[!ToggleConfig "Spaceship\Overlay\Control" "Control.ini"]

[Metadata]
Name=Spaceship | Frame
Author=Senai Sorsa + Claude
Information=The cockpit, built from Shape meters: theme-tinted glass with glare and scanlines, the hull silhouette, ~1000 traced hull pieces (generated by tools/vector_frame.py from art/cockpit-trace.svg), procedural surface detail (sheen, rim light, seams, rivets, vents, rails, LEDs; tools/frame_detail.py), HUD light spill, strut lights and theme-coloured HUD lines with neon bloom. UseShipImage=1 swaps the vector hull for a picture (tools/image_frame.py). Click-through, sits on the desktop under every module.
Version=2.1.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeOffsets=#@#Offsets.inc
@IncludeGeometry=#CURRENTPATH#Geometry.inc

; drawing order: glass tint, glare, scanlines, hull silhouette, traced hull pieces (stacking order)
[Order]
Measure=Calc
Formula=0
@IncludeGlass=#CURRENTPATH#Parts\Glass.inc
@IncludeGlare=#CURRENTPATH#Parts\Glare.inc
@IncludeScan=#CURRENTPATH#Parts\Scan.inc
@IncludeBase=#CURRENTPATH#Parts\Base.inc
@IncludeHull01=#CURRENTPATH#Parts\Hull_01.inc
@IncludeHull02=#CURRENTPATH#Parts\Hull_02.inc
@IncludeHull03=#CURRENTPATH#Parts\Hull_03.inc
@IncludeHull04=#CURRENTPATH#Parts\Hull_04.inc
@IncludeHull05=#CURRENTPATH#Parts\Hull_05.inc
@IncludeHull06=#CURRENTPATH#Parts\Hull_06.inc
@IncludeHull07=#CURRENTPATH#Parts\Hull_07.inc
@IncludeHull08=#CURRENTPATH#Parts\Hull_08.inc
@IncludeHull09=#CURRENTPATH#Parts\Hull_09.inc
@IncludeHull10=#CURRENTPATH#Parts\Hull_10.inc
@IncludeHull11=#CURRENTPATH#Parts\Hull_11.inc
@IncludeHull12=#CURRENTPATH#Parts\Hull_12.inc
@IncludeHull13=#CURRENTPATH#Parts\Hull_13.inc
@IncludeHull14=#CURRENTPATH#Parts\Hull_14.inc
@IncludeHull15=#CURRENTPATH#Parts\Hull_15.inc
@IncludeHull16=#CURRENTPATH#Parts\Hull_16.inc
@IncludeHull17=#CURRENTPATH#Parts\Hull_17.inc

; image mode (Settings.inc UseShipImage=1): a cockpit picture with the windows cut out, made by
; tools/image_frame.py. The traced hull and its surface detail hide; glass, HUD light and lines stay.
[ShipImage]
Meter=Image
ImageName=#@#Images\#ShipImage#
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
Hidden=(1-#UseShipImage#)

; over the hull: metal sheen and rim light, greebles, HUD light spill, strut lights + LEDs, HUD lines
[OrderOver]
Measure=Calc
Formula=0
@IncludeSheen=#CURRENTPATH#Parts\Sheen.inc
@IncludeGreebles=#CURRENTPATH#Parts\Greebles.inc
@IncludeSpill=#CURRENTPATH#Parts\Spill.inc
@IncludeLights=#CURRENTPATH#Parts\Lights.inc
@IncludeDecor=#CURRENTPATH#Parts\Decor.inc
