[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Spaceship
OnRefreshAction=[!Move "#OriginX#" "#OriginY#"][!ZPos -2][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
ContextTitle=Control Center
ContextAction=[!ToggleConfig "Spaceship\Overlay\Control" "Control.ini"]

[Metadata]
Name=Spaceship | Frame
Author=Senai Sorsa + Claude
Information=The cockpit, built entirely from Shape meters: theme-tinted window glass, the hull silhouette, ~1000 traced hull pieces (Parts\Hull_*.inc, generated by tools/vector_frame.py from art/cockpit-trace.svg), strut lights and theme-coloured HUD lines. Click-through, sits on the desktop under every module.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeOffsets=#@#Offsets.inc
@IncludeGeometry=#CURRENTPATH#Geometry.inc

; drawing order: glass tint, hull silhouette, traced hull pieces (stacking order), lights, HUD lines
[Order]
Measure=Calc
Formula=0
@IncludeGlass=#CURRENTPATH#Parts\Glass.inc
@IncludeBase=#CURRENTPATH#Parts\Base.inc
@IncludeHull01=#CURRENTPATH#Parts\Hull_01.inc
@IncludeHull02=#CURRENTPATH#Parts\Hull_02.inc
@IncludeHull03=#CURRENTPATH#Parts\Hull_03.inc
@IncludeHull04=#CURRENTPATH#Parts\Hull_04.inc
@IncludeHull05=#CURRENTPATH#Parts\Hull_05.inc
@IncludeHull06=#CURRENTPATH#Parts\Hull_06.inc
@IncludeHull07=#CURRENTPATH#Parts\Hull_07.inc
@IncludeHull08=#CURRENTPATH#Parts\Hull_08.inc
@IncludeHull09=#CURRENTPATH#Parts\Hull_09.inc
@IncludeHull10=#CURRENTPATH#Parts\Hull_10.inc
@IncludeHull11=#CURRENTPATH#Parts\Hull_11.inc
@IncludeHull12=#CURRENTPATH#Parts\Hull_12.inc
@IncludeHull13=#CURRENTPATH#Parts\Hull_13.inc
@IncludeHull14=#CURRENTPATH#Parts\Hull_14.inc
@IncludeHull15=#CURRENTPATH#Parts\Hull_15.inc
@IncludeHull16=#CURRENTPATH#Parts\Hull_16.inc
@IncludeHull17=#CURRENTPATH#Parts\Hull_17.inc
@IncludeLights=#CURRENTPATH#Parts\Lights.inc
@IncludeDecor=#CURRENTPATH#Parts\Decor.inc
