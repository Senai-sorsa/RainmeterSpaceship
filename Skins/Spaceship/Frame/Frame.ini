[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Spaceship
OnRefreshAction=[!Move "#OriginX#" "#OriginY#"][!ZPos -2][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
ContextTitle=Control Center
ContextAction=[!ToggleConfig "Spaceship\Overlay\Control" "Control.ini"]

[Metadata]
Name=Spaceship | Frame
Author=Senai Sorsa + Claude
Information=The cockpit: hull, struts, dashboard and window tint. Click-through, sits on the desktop under every module. Regenerate the art with tools/frame_art.py.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeOffsets=#@#Offsets.inc
@IncludeGeometry=#CURRENTPATH#Geometry.inc

; theme-coloured tint across the windows (strength: GlassTint in Settings.inc, 0 = clear)
[GlassTint]
Meter=Image
ImageName=#@#Images\glass.png
ImageTint=#ColorAccent#
ImageAlpha=#GlassTint#
W=(2560*#Scale#)
H=(1600*#Scale#)
X=0
Y=0

[Hull]
Meter=Image
ImageName=#@#Images\frame.png
W=(2560*#Scale#)
H=(1600*#Scale#)
X=0
Y=0
