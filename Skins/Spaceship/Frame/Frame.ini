[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Spaceship
OnRefreshAction=[!Move "#OriginX#" "#OriginY#"][!ZPos -2][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
ContextTitle=Control Center
ContextAction=[!ToggleConfig "Spaceship\Overlay\Control" "Control.ini"]

[Metadata]
Name=Spaceship | Frame
Author=Senai Sorsa + Claude
Information=The cockpit, built from ~2000 Shape meters and symmetric left/right (tools/ship_frame.py): theme-tinted glass with glare and scanlines, a shaded gunmetal hull, window frames with rim light, surface detail, instrument housings, HUD light spill, strut lights and theme-coloured HUD lines. UseShipImage=1 swaps the vector hull for a picture (tools/image_frame.py). Click-through, sits on the desktop under every module.
Version=3.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeOffsets=#@#Offsets.inc
@IncludeGeometry=#CURRENTPATH#Geometry.inc

; drawing order: glass tint, glare, scanlines, shaded hull
[Order]
Measure=Calc
Formula=0
@IncludeGlass=#CURRENTPATH#Parts\Glass.inc
@IncludeGlare=#CURRENTPATH#Parts\Glare.inc
@IncludeScan=#CURRENTPATH#Parts\Scan.inc
@IncludeHull=#CURRENTPATH#Parts\Hull.inc

; picture mode (Settings.inc UseShipImage=1): a cockpit picture with the windows cut out, made by
; tools/image_frame.py. The vector hull, frames, detail and lights hide; glass, housings, HUD light and lines stay.
[ShipImage]
Meter=Image
ImageName=#@#Images\#ShipImage#
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
Hidden=(1-#UseShipImage#)

; over the hull: window frames, surface detail, instrument housings, HUD light spill, lights, HUD lines
[OrderOver]
Measure=Calc
Formula=0
@IncludeFrames=#CURRENTPATH#Parts\Frames.inc
@IncludeGreebles=#CURRENTPATH#Parts\Greebles.inc
@IncludeHousings=#CURRENTPATH#Parts\Housings.inc
@IncludeSpill=#CURRENTPATH#Parts\Spill.inc
@IncludeLights=#CURRENTPATH#Parts\Lights.inc
@IncludeDecor=#CURRENTPATH#Parts\Decor.inc
