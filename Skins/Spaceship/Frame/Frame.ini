[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Spaceship
OnRefreshAction=[!Move "#OriginX#" "#OriginY#"][!ZPos -2][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
ContextTitle=Control Center
ContextAction=[!ToggleConfig "Spaceship\Overlay\Control" "Control.ini"]

[Metadata]
Name=Spaceship | Frame
Author=Senai Sorsa + Claude
Information=The cockpit, symmetric left/right: theme-tinted glass with smudges, reflections, scanlines and soft dark tints; the textured hull pre-rendered by tools/ship_frame.py (Images\hull.png, windows cut by a mask); theme-coloured rim glow, LEDs, strut lights, HUD light and HUD lines as live shapes. UseShipImage=1 shows your own picture instead (tools/image_frame.py). Click-through, sits on the desktop under every module.
Version=4.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeOffsets=#@#Offsets.inc
@IncludeGeometry=#CURRENTPATH#Geometry.inc

; drawing order: window tint, glass smudges + glare, scanlines, dark tints, hull, picture, live accents
[Order]
Measure=Calc
Formula=0
@IncludeGlass=#CURRENTPATH#Parts\Glass.inc

[GlassFX]
Meter=Image
ImageName=#@#Images\glass_fx.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=(Clamp(#GlassGlare#*21,0,255))

[Scan]
Meter=Image
ImageName=#@#Images\scan.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=(Clamp(#ScanAlpha#*18,0,255))
Hidden=(1-#ScanLines#)

; soft dark tints where the HUD sits (no boxes)
[Shade]
Meter=Image
ImageName=#@#Images\shade.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=#ShadeAlpha#

; the textured hull, pre-rendered by tools/ship_frame.py (windows transparent)
[Hull]
Meter=Image
ImageName=#@#Images\hull.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=#HullAlpha#
Hidden=#UseShipImage#

; picture mode (UseShipImage=1): your own cockpit picture, windows cut by tools/image_frame.py
[ShipImage]
Meter=Image
ImageName=#@#Images\#ShipImage#
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=#HullAlpha#
Hidden=(1-#UseShipImage#)

; neon mist: wide, very dim light bleeding off the window edges and corner cuts (theme colour)
[Mist]
Meter=Image
ImageName=#@#Images\mist.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageTint=#ColorAccent#
ImageAlpha=#MistAlpha#

; the visor corner pieces, over the mist so it only spreads inward (frame_render.corners_png)
[Corners]
Meter=Image
ImageName=#@#Images\corners.png
X=0
Y=0
W=(2560*#Scale#)
H=(1600*#Scale#)
PreserveAspectRatio=0
ImageAlpha=#HullAlpha#
Hidden=#UseShipImage#

; live, theme-coloured: rim glow + LEDs, HUD light on the dash, strut lights, HUD lines
[OrderOver]
Measure=Calc
Formula=0
@IncludeAccents=#CURRENTPATH#Parts\Accents.inc
@IncludeSpill=#CURRENTPATH#Parts\Spill.inc
@IncludeLights=#CURRENTPATH#Parts\Lights.inc
@IncludeDecor=#CURRENTPATH#Parts\Decor.inc
