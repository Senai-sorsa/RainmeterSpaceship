[Rainmeter]
Update=250
@Include=#@#Common.inc

[Variables]
ZLayer=1
AskIn=

[Metadata]
Name=Spaceship | Clover log
Author=Senai Sorsa + Claude
Information=Everything you and Clover have said (Data\jarvis_log.txt), with his reply appearing live as he writes it. Opens by itself when your speakers are muted, when you ask Clover to show what he's said, or from a right-click on the hologram. Scroll to read back, X to close.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mScript]
Measure=Script
ScriptFile=#@#Scripts\jarvislog.lua

; TYPE button (T5): text for Clover instead of speech, also with the speakers muted. Command1 hands it to AskJarvis() in jarvislog.lua
[mAsk]
Measure=Plugin
Plugin=InputText
SolidColor=3,9,16,255
FontColor=0,210,255,255
FontFace=Rajdhani
FontSize=14
X=(150*#Scale#)
Y=(556*#Scale#)
W=(860*#Scale#)
H=(36*#Scale#)
Command1=[!SetVariable AskIn """$UserInput$"""][!CommandMeasure mScript "AskJarvis()"]

@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc
