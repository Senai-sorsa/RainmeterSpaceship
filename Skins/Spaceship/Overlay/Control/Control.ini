[Rainmeter]
Update=1000
; closed from the right-click menu: still reload the HUD if settings are waiting
OnCloseAction=[!CommandMeasure mScript "Flush()"]
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Control Center
Author=Senai Sorsa + Claude
Information=Adjust everything: modules on/off and click-through, layout nudging with an overlap guard, theme and window tint, app slots, HWiNFO sensors, performance tiers, power actions and presets with undo.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
ZLayer=1
@IncludeHW=#@#HWiNFO.inc

[mGPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0

[mScript]
Measure=Script
ScriptFile=#@#Scripts\control.lua
@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc

; CALL ME row: asks for the name CLOVER uses; Command1 hands it to SetCallMe() in control.lua
[mInput]
Measure=Plugin
Plugin=InputText
SolidColor=3,9,16,255
FontColor=0,210,255,255
FontFace=Rajdhani
FontSize=14
X=(214*#Scale#)
Y=(120*#Scale#)
W=(500*#Scale#)
H=(36*#Scale#)
Command1=[!SetVariable CallMeIn """$UserInput$"""][!CommandMeasure mScript "SetCallMe()"]

; TYPE TO HIM row: text for CLOVER instead of speech; Command1 hands it to AskJarvis() in control.lua
[mAsk]
Measure=Plugin
Plugin=InputText
SolidColor=3,9,16,255
FontColor=0,210,255,255
FontFace=Rajdhani
FontSize=14
X=(214*#Scale#)
Y=(120*#Scale#)
W=(500*#Scale#)
H=(36*#Scale#)
Command1=[!SetVariable AskIn """$UserInput$"""][!CommandMeasure mScript "AskJarvis()"]
