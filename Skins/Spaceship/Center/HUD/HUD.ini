[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Flight HUD
Author=Senai Sorsa + Claude
Information=Centre HUD: clock and date, CPU clock tape (left), GPU tape (right), throttle/fan readout, network variometer and the next rocket launch countdown (Launch Library 2).
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc
@IncludeSensors=#@#Measures\Sensors.inc

[mTime]
Measure=Time
Format=%H:%M:%S

[mDate]
Measure=Time
Format=%a %d %b %Y

[mLaunch]
Measure=WebParser
URL=https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=1&mode=list
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=1800
FinishAction=[!CommandMeasure mScript "OnLaunch()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\hud.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
