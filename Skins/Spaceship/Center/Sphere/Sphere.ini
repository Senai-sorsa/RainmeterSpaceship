[Rainmeter]
Update=33
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Jarvis core
Author=Senai Sorsa + Claude
Information=Jarvis hologram (replaces the globe): your frame animation in Images\Jarvis\Idle + \Active inside spinning rings, driven by the Jarvis service (Jarvis\jarvis.py). Click: talk / stop, right-click: conversation log. Speakers muted: answers appear in the log pop-up instead. STANDBY cyan, LISTENING amber, THINKING, SPEAKING (the voice layer swells with his voice), OFFLINE dim. 30 fps on FULL, slower on LITE / LOW, hidden on STEALTH.
Version=1.0.0
License=CC BY-NC-SA 4.0

; speakers muted / at 0 % -> Jarvis answers in the log pop-up instead of out loud
[mVol]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=30

[mScript]
Measure=Script
ScriptFile=#@#Scripts\jarvis.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
