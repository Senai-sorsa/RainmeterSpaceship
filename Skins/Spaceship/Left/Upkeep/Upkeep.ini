[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Upkeep
Author=Senai Sorsa + Claude
Information=Pending Windows updates, winget upgrades and antivirus state (checked hourly in the background).
Version=1.0.0
License=CC BY-NC-SA 4.0

[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\upkeep.ps1"
State=Hide
OutputType=ANSI
Timeout=300000
FinishAction=[!CommandMeasure mScript "OnRun()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\status_block.lua
Kind=upkeep
Mirror=0
@IncludeMeters=#CURRENTPATH#Meters.inc
