[Rainmeter]
Update=100
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Systems dial
Author=Senai Sorsa + Claude
Information=Systems dial: brightness, volume, microphone, power mode, refresh rate and HUD glow. Click a label to select, scroll or click the ring to set.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]

[mVol]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=10

[mLlt]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\llt.ps1"
State=Hide
OutputType=ANSI
Timeout=30000
FinishAction=[!CommandMeasure mScript "OnLltDone()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\dial.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
