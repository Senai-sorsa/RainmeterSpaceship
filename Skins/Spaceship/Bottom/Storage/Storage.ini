[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Storage
Author=Senai Sorsa + Claude
Information=Bottom-left screen: drive fill ring, read / write activity, SSD temperature, second drive. Click the ring to open the drive, right-click for WinDirStat.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mD1Free]
Measure=FreeDiskSpace
Drive=#Drive1#
UpdateDivider=10

[mD1Total]
Measure=FreeDiskSpace
Drive=#Drive1#
Total=1
UpdateDivider=60

[mD2Free]
Measure=FreeDiskSpace
Drive=#Drive2#
IgnoreRemovable=0
UpdateDivider=10

[mD2Total]
Measure=FreeDiskSpace
Drive=#Drive2#
Total=1
IgnoreRemovable=0
UpdateDivider=60

[mRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=_Total

[mWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=_Total

[mScript]
Measure=Script
ScriptFile=#@#Scripts\storage.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
