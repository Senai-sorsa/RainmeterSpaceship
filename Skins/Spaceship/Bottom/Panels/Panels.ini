[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Side panels
Author=Senai Sorsa + Claude
Information=The two tilted screens at the bottom corners of the dash, angled with their panels: pilot (user name), date and time on the left; host, Windows and display on the right.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[mHost]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[mScript]
Measure=Script
ScriptFile=#@#Scripts\panels.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
