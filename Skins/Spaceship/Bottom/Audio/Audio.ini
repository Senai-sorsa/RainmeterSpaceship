[Rainmeter]
Update=50
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Audio
Author=Senai Sorsa + Claude
Information=Bottom-right screen: output device (click to cycle), volume arc (scroll to change, click to mute), live waveform and media keys.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mVol]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=10

[mMedia]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\media.ps1" -Key playpause
State=Hide

[mAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=10
FFTDecay=120
Bands=24
FreqMin=40
FreqMax=14000
Sensitivity=40
Group=Audio

[mBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=mAudio
Type=Band
BandIdx=0
Group=Audio

