[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Console
Author=Senai Sorsa + Claude
Information=Top centre: GPU mode tabs (ECO / HYBRID / AUTO / dGPU / OFF) and quick settings (power mode, refresh rate, 80% charge limit, performance tier, dGPU light, CARGO drawer, MASTER kill switch, Control Center). Uses Legion Toolkit's CLI.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mLlt]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\llt.ps1"
State=Hide
OutputType=ANSI
Timeout=60000
FinishAction=[!CommandMeasure mScript "OnLltDone()"]

[mStatus]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\status.ps1" -Exe "#LltPath#" -Hybrid "#LltHybridFeature#" -Power "#LltPowerFeature#" -Refresh "#LltRefreshFeature#" -Battery "#LltBatteryFeature#"
State=Hide
OutputType=ANSI
Timeout=60000
FinishAction=[!CommandMeasure mScript "OnStatus()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\console.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
