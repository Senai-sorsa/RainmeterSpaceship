[Rainmeter]
Update=2000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Alert
Author=Senai Sorsa + Claude
Information=Warning triangle with the number of active warnings; hover for the list.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[mDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=-1

[mBattPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[mCPU]
Measure=CPU
Processor=0

[mScript]
Measure=Script
ScriptFile=#@#Scripts\alert.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
