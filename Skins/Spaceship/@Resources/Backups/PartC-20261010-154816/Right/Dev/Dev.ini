[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Dev status
Author=Senai Sorsa + Claude
Information=WSL distros running, Ollama models loaded, Tailscale state, Docker containers (every 2 minutes).
Version=1.0.0
License=CC BY-NC-SA 4.0

[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\dev.ps1"
State=Hide
OutputType=ANSI
Timeout=60000
FinishAction=[!CommandMeasure mScript "OnRun()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\status_block.lua
Kind=dev
Mirror=1
@IncludeMeters=#CURRENTPATH#Meters.inc
