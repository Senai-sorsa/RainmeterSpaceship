[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | System info
Author=Senai Sorsa + Claude
Information=Ship identity card: device name, OS, CPU, GPUs, RAM, display, uptime and IP. Edit Hardware.inc to change the text.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mUptime]
Measure=Uptime
Format="%4!i!d %3!02i!:%2!02i!"

[mIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=60

[mOS]
Measure=Plugin
Plugin=SysInfo
SysInfoType=OS_VERSION
UpdateDivider=-1

[mScript]
Measure=Script
ScriptFile=#@#Scripts\sysinfo.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
