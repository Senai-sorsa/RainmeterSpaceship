[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Side panels
Author=Senai Sorsa + Claude
Information=The two tilted screens at the bottom corners of the dash, angled with their panels. Left: pilot (user name), date, time, week, year progress, UTC offset, boot time, uptime and idle time. Right: host, Windows, display, CPU threads, memory, OS bits, monitors, IP address and Wi-Fi network.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[mHost]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[mUptime]
Measure=Uptime

[mThreads]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_PROCESSORS
UpdateDivider=-1

[mRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mIdle]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IDLE_TIME

[mBits]
Measure=Plugin
Plugin=SysInfo
SysInfoType=OS_BITS
UpdateDivider=-1

[mMonitors]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_MONITORS
UpdateDivider=10

[mIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=10

[mSSID]
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=SSID
UpdateDivider=10

[mScript]
Measure=Script
ScriptFile=#@#Scripts\panels.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
