[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Info strip
Author=Senai Sorsa + Claude
Information=Bottom strip along the dash arc: CPU / GPU temperature, fans, network, ping, Wi-Fi, battery wear.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mNetIn]
Measure=NetIn

[mNetOut]
Measure=NetOut

[mPing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=15

[mWifi]
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=QUALITY
UpdateDivider=10

[mCPU]
Measure=CPU
Processor=0

[mScript]
Measure=Script
ScriptFile=#@#Scripts\strip.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
