[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Info strip
Author=Senai Sorsa + Claude
Information=Bottom strip along the dash arc: CPU / GPU temperature, CPU load, fan | drive fill, disk activity, ping, Wi-Fi.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mD1Free]
Measure=FreeDiskSpace
Drive=#Drive1#
UpdateDivider=10

[mD1Total]
Measure=FreeDiskSpace
Drive=#Drive1#
Total=1
UpdateDivider=60

[mDiskIO]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Bytes/sec
Name=_Total

[mPing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=15

[mWifi]
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=QUALITY
UpdateDivider=10

[mCPU]
Measure=CPU
Processor=0

[mScript]
Measure=Script
ScriptFile=#@#Scripts\strip.lua
@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc
