[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Variables]
ZLayer=1

[Metadata]
Name=Spaceship | CARGO drawer
Author=Senai Sorsa + Claude
Information=Every category as a drop-down list. Click a category to open it, click an app to launch it. Scroll to move. Closes itself after 20 seconds idle.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mProbe]
Measure=Plugin
Plugin=Process
ProcessName=none.exe

[mScript]
Measure=Script
ScriptFile=#@#Scripts\drawer.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
