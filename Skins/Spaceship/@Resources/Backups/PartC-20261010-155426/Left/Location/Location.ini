[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Location
Author=Senai Sorsa + Claude
Information=LAT / LON / ALT bar. Precise position from Windows Location Services when allowed, otherwise approximate from your public IP (ip-api.com). Click to mask the digits.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mGeoIP]
Measure=WebParser
URL=http://ip-api.com/json/?fields=status,lat,lon,city,regionName,countryCode,timezone
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=600
Disabled=(1 - #LocationEnabled#)
FinishAction=[!CommandMeasure mScript "OnGeo()"]

[mGeoPrecise]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\location.ps1"
State=Hide
OutputType=ANSI
Timeout=30000
FinishAction=[!CommandMeasure mScript "OnPrecise()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\location.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
