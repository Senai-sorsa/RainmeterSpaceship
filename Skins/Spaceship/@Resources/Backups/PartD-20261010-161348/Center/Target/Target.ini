[Rainmeter]
Update=50
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Target lock
Author=Senai Sorsa + Claude
Information=Orange target lock on the busiest process: rank, CPU share and memory (e.g. 567m = 567 MB). Click to cycle targets 1-5, right-click for Task Manager.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mThreads]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_PROCESSORS
UpdateDivider=-1

[mTop1]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mTop2]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=2
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mTop3]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=3
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mTop4]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=4
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mTop5]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=5
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mTargetRam]
Measure=Plugin
Plugin=UsageMonitor
Alias=RAM
Rollup=1
Name=explorer
UpdateDivider=20

[mScript]
Measure=Script
ScriptFile=#@#Scripts\target.lua
@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc
