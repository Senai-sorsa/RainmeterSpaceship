[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Network
Author=Senai Sorsa + Claude
Information=Network block: ping, LAN and public (WAN) address - click to mask - live down / up in Mbps, and the last speed test (click the box to run one).
Version=1.0.0
License=CC BY-NC-SA 4.0

[mPing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
Timeout=3000
UpdateRate=10

[mIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=30

[mWAN]
Measure=WebParser
URL=https://api.ipify.org
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=300
FinishAction=[!CommandMeasure mScript "OnWan(1)"]
OnConnectErrorAction=[!CommandMeasure mScript "OnWan(0)"]
OnRegExpErrorAction=[!CommandMeasure mScript "OnWan(0)"]

[mWifi]
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=QUALITY
UpdateDivider=5

[mNetIn]
Measure=NetIn
; same adapter (the active one) and the same 3-sample smoothing in every module, so all readouts agree
Interface=Best
AverageSize=3

[mNetOut]
Measure=NetOut
Interface=Best
AverageSize=3

[mScript]
Measure=Script
ScriptFile=#@#Scripts\sysinfo.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
