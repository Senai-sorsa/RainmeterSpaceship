[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Battery
Author=Senai Sorsa + Claude
Information=Top-right bar: battery level, time to the charge limit (charging) or time to empty.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mBattPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[mLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=LIFETIME

[mScript]
Measure=Script
ScriptFile=#@#Scripts\battery.lua
@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc
