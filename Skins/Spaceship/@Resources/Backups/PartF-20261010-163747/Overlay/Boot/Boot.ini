[Rainmeter]
Update=16
AccurateText=1
Group=SpaceshipBoot
SkinWidth=(2560*#Scale#)
SkinHeight=(1600*#Scale#)
OnRefreshAction=[!Move "(#OriginX#+#MonX#)" "(#OriginY#+#MonY#)"][!ZPos 1][!ClickThrough 1][!KeepOnScreen 0][!Draggable 0][!SnapEdges 0]
; whatever happens, closing this skin brings the whole HUD back
OnCloseAction=[!SetTransparencyGroup 255 Spaceship]

[Metadata]
Name=Spaceship | Boot
Author=Senai Sorsa + Claude
Information=Startup sequence (plays once when Rainmeter starts, then unloads itself): a scanner sweeps the screen top to bottom, the frame fades in, the panels flicker on right to left while the dials spin up, then a short system check. Off: BootAnim=0 in Settings.inc. Replay: right-click any panel > Play startup sequence.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeState=#@#State.inc

; ---------------------------------------------------------------- system check readings
[mCPU]
Measure=CPU
Group=Check
UpdateDivider=15

[mGPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
Group=Check
UpdateDivider=15

[mRAM]
Measure=PhysicalMemory
Group=Check
UpdateDivider=15

[mDisk]
Measure=FreeDiskSpace
Drive=#Drive1#
IgnoreRemovable=0
Group=Check
UpdateDivider=15

[mIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
Group=Check
UpdateDivider=15

[mAudio]
Measure=Plugin
Plugin=Win7AudioPlugin
Group=Check
UpdateDivider=15

[mBat]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
Group=Check
UpdateDivider=15

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
Group=Check
UpdateDivider=15

[mScript]
Measure=Script
ScriptFile=#@#Scripts\boot.lua

; ---------------------------------------------------------------- scanner (all meters drawn in 2560x1600 design units)
; one thin glowing line (the line sits at y=40 inside the meter; Lua moves the meter)
[Scanner]
Meter=Shape
X=0
Y=-100
TransformationMatrix=#Scale#;0;0;#Scale#;0;0
Shape=Rectangle 0,10,2560,26 | Fill LinearGradient GTrail | StrokeWidth 0
GTrail=90 | #ColorAccent#,0 ; 0.0 | #ColorAccent#,30 ; 1.0
Shape2=Rectangle 0,34,2560,12 | Fill LinearGradient GBeam | StrokeWidth 0
GBeam=90 | #ColorAccent#,0 ; 0.0 | #ColorAccent#,200 ; 0.5 | #ColorAccent#,0 ; 1.0
Shape3=Rectangle 0,39.3,2560,1.4 | Fill Color 235,252,255,255 | StrokeWidth 0
; ruler ticks riding under the line: minor every 64, major every 320
Shape4=Line 0,46,2560,46 | StrokeWidth 8 | Stroke Color #ColorAccent#,150 | StrokeDashes 0.15;7.85 | StrokeStartCap Flat | StrokeEndCap Flat | StrokeDashCap Flat
Shape5=Line 0,50,2560,50 | StrokeWidth 16 | Stroke Color 235,252,255,200 | StrokeDashes 0.1;19.9 | StrokeStartCap Flat | StrokeEndCap Flat | StrokeDashCap Flat
; end brackets
Shape6=Path PL | Fill Color 0,0,0,0 | Stroke Color #ColorAccent#,255 | StrokeWidth 2.5
PL=34,26 | LineTo 22,26 | LineTo 22,54 | LineTo 34,54
Shape7=Path PR | Fill Color 0,0,0,0 | Stroke Color #ColorAccent#,255 | StrokeWidth 2.5
PR=2526,26 | LineTo 2538,26 | LineTo 2538,54 | LineTo 2526,54
; centre marker
Shape8=Path PC | Fill Color #ColorAccent#,60 | Stroke Color 235,252,255,230 | StrokeWidth 1.5
PC=1280,30 | LineTo 1290,40 | LineTo 1280,50 | LineTo 1270,40 | ClosePath 1
Shape9=Rectangle 1180,38,70,4 | Fill Color #ColorAccent#,230 | StrokeWidth 0
Shape10=Rectangle 1310,38,70,4 | Fill Color #ColorAccent#,230 | StrokeWidth 0

; bright spark racing along the line
[Flare]
Meter=Shape
X=-200
Y=-100
TransformationMatrix=#Scale#;0;0;#Scale#;0;0
Shape=Ellipse 0,0,90,7 | Fill RadialGradient GF | StrokeWidth 0
GF=0,0 | 255,255,255,255 ; 0.0 | #ColorAccent#,170 ; 0.35 | #ColorAccent#,0 ; 1.0

[sScan]
AntiAlias=1
FontFace=#FontNum#
FontSize=9
FontWeight=700
FontColor=#ColorAccent#
TransformationMatrix=#Scale#;0;0;#Scale#;0;0
Text=

[ScanL]
Meter=String
MeterStyle=sScan
X=44
Y=-100
StringAlign=LeftBottom

[ScanR]
Meter=String
MeterStyle=sScan
X=2516
Y=-100
StringAlign=RightBottom

; ---------------------------------------------------------------- system check readout
[CheckBg]
Meter=Shape
X=0
Y=0
Hidden=1
TransformationMatrix=#Scale#;0;0;#Scale#;0;0
PBg=1084,566 | LineTo 1476,566 | LineTo 1492,582 | LineTo 1492,816 | LineTo 1476,832 | LineTo 1084,832 | LineTo 1068,816 | LineTo 1068,582 | ClosePath 1
Shape=Path PBg | Fill Color 0,10,18,215 | Stroke Color #ColorAccent#,110 | StrokeWidth 1.4
Shape2=Rectangle 1100,606,360,1.4 | Fill Color #ColorAccent#,150 | StrokeWidth 0
Shape3=Rectangle 1100,783,360,1.4 | Fill Color #ColorAccent#,150 | StrokeWidth 0
Shape4=Rectangle 1084,563,120,4 | Fill Color #ColorAccent#,255 | StrokeWidth 0
Shape5=Rectangle 1356,831,120,4 | Fill Color #ColorAccent#,255 | StrokeWidth 0

