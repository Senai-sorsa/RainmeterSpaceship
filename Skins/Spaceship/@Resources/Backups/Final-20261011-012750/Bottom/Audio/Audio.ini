[Rainmeter]
Update=50
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Audio
Author=Senai Sorsa + Claude
Information=Audio reactor: rounded-dash volume ring, red peak ticks, loudness sweep, radial fine-grain waveform, pulsing core (click: mute), media keys in the glass wedge, device + volume at the bottom (click: next device). Scroll: volume.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mVol]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=10

[mMedia]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\media.ps1" -Key playpause
State=Hide

[mAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTOverlap=1024
FFTAttack=25
FFTDecay=140
Bands=96
FreqMin=35
FreqMax=16000
Sensitivity=42
Group=Audio

[mRMS]
Measure=Plugin
Plugin=AudioLevel
Parent=mAudio
Type=RMS
Group=Audio

[mPeak]
Measure=Plugin
Plugin=AudioLevel
Parent=mAudio
Type=Peak
Group=Audio

