[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Side panels
Author=Senai Sorsa + Claude
Information=The two tilted screens at the bottom corners of the dash, angled with their panels. Left: pilot (user name), date, time, week, year progress, UTC offset, boot time, uptime and idle time. Right: host, Windows, CPU, GPU, memory, display + refresh rate, uptime, and a TERMINAL button (left-click Windows Terminal, right-click PowerShell).
Version=1.0.0
License=CC BY-NC-SA 4.0

[mUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[mHost]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[mUptime]
Measure=Uptime

[mRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mIdle]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IDLE_TIME

[mScript]
Measure=Script
ScriptFile=#@#Scripts\panels.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
