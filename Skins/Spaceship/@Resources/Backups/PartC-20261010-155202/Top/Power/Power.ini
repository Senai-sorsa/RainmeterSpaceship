[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Power
Author=Senai Sorsa + Claude
Information=Top-left bar: total power draw (CPU + GPU package, or battery discharge) from HWiNFO.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[mScript]
Measure=Script
ScriptFile=#@#Scripts\power.lua
@IncludeMeters=#CURRENTPATH#Meters.inc

@IncludeCaption=#@#Caption.inc
