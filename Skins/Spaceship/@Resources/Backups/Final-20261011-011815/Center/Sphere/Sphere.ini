[Rainmeter]
Update=50
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Radar sphere
Author=Senai Sorsa + Claude
Information=Rotating 3D wireframe globe. Blips on the radar disk are the busiest processes; ISS position (open-notify) and your position are plotted on the globe. Slows down / freezes with the performance tier.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mThreads]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_PROCESSORS
UpdateDivider=-1

[mNetIn]
Measure=NetIn
; same adapter (the active one) and the same 3-sample smoothing in every module, so all readouts agree
Interface=Best
AverageSize=3
UpdateDivider=20

[mNetOut]
Measure=NetOut
; same adapter (the active one) and the same 3-sample smoothing in every module, so all readouts agree
Interface=Best
AverageSize=3
UpdateDivider=20

[mISS]
Measure=WebParser
URL=http://api.open-notify.org/iss-now.json
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=1200
FinishAction=[!CommandMeasure mScript "OnISS()"]

[mGeo]
Measure=WebParser
URL=http://ip-api.com/json/?fields=status,lat,lon
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=12000
Disabled=(1 - #LocationEnabled#)

[mP1]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP2]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=2
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP3]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=3
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP4]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=4
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP5]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=5
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP6]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=6
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP7]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=7
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mP8]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=8
Rollup=1
Blacklist=_Total|Idle|System|Memory Compression|Registry
UpdateDivider=20

[mScript]
Measure=Script
ScriptFile=#@#Scripts\sphere.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
