[Rainmeter]
Update=50
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Flight HUD
Author=Senai Sorsa + Claude
Information=Centre HUD (reference speed ladders): S&P 500 day-change tape (left), GPU tape (right), CPU-load pointer, diamond pipper, SPX / THR readout. Tapes scroll smoothly.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@IncludeHW=#@#HWiNFO.inc
@IncludeSensors=#@#Measures\Sensors.inc
DataDivider=20


; S&P 500 (hud.lua OnSPX): Update is 50 ms here, so UpdateRate 6000 = 5 minutes (72000 = 1 hour when closed)
[mSPX]
Measure=WebParser
URL=https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1d&interval=15m
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=6000
FinishAction=[!CommandMeasure mScript "OnSPX()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\hud.lua
@IncludeMeters=#CURRENTPATH#Meters.inc
@IncludeExtra=#CURRENTPATH#Extra.inc

@IncludeCaption=#@#Caption.inc
