[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Slot 1
Author=Senai Sorsa + Claude
Information=App slot 1: a single app or a category (tab line on top). Choose with Slot1= in Apps.ini or Control Center > APPS.
Version=1.0.0
License=CC BY-NC-SA 4.0

[mProc]
