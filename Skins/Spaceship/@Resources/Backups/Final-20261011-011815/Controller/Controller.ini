[Rainmeter]
Update=1000
@Include=#@#Common.inc

[Metadata]
Name=Spaceship | Controller
Author=Senai Sorsa + Claude
Information=Invisible brain: performance tiers (with hysteresis and battery cap), MASTER kill switch, edit mode, Start-menu app scan (first run + daily) and app icon extraction and HWiNFO sensor auto-mapping. Builds and keeps alive the ShipCore helper (window states for the app cards).
Version=1.0.0
License=CC BY-NC-SA 4.0

[mGPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[mScan]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\scan-apps.ps1"
State=Hide
OutputType=ANSI
Timeout=120000
FinishAction=[!CommandMeasure mScript "OnScan()"]

[mIcons]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\app-icons.ps1"
State=Hide
OutputType=ANSI
Timeout=300000
FinishAction=[!CommandMeasure mScript "OnIcons()"]

[mHwScan]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\hwinfo-scan.ps1"
State=Hide
OutputType=ANSI
Timeout=60000
FinishAction=[!CommandMeasure mScript "OnHwScan()"]

[mCore]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\core.ps1"
State=Hide
OutputType=ANSI
Timeout=180000
FinishAction=[!CommandMeasure mScript "OnCore()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\controller.lua

[Anchor]
Meter=Shape
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
