; =====================================================================================
;  SPACESHIP HUD - APP CATALOG
; =====================================================================================
;  [Layout] decides what each panel shows. Every entry can be EITHER:
;     an app id        -> the slot shows that single app            (e.g. Slot1=chrome)
;     a category id    -> the slot shows a tab line to pick an app  (e.g. Slot2=dev)
;
;  Targets: list one or more, separated by  ||  - the first one that exists wins.
;     start:<Start menu name>   matched against your Start menu (exact, then "starts with",
;                               then "contains"; shortest name wins). Best choice - it
;                               survives updates and works for Store apps.
;     C:\path\to\app.exe        a file; checked for existence
;     cmd:<command>             always treated as present (explorer.exe, wt.exe, ms-settings:)
;  Apps whose targets are all missing are hidden (HideMissing=1), so you can list
;  software you have not installed yet - it appears after Control Center > APPS > RESCAN.
;
;  Icon: any name from Scripts\icons.lua  (rocket airfoil aircraft satellite cube matrix mesh
;        flow map globe folder code terminal linux ai chip board wave orbit camera screenshot
;        film pen palette chat video mail note book lock gauge gpu disk usb toolbox star search
;        clipboard archive pdf check music game cloud nodes gear wrench box git window drive
;        shield blender)
;  Short: label used on tab lines (keep it <= 9 characters)
;  Proc:  process name used to show the RUNNING pulse (optional)
;
;  ADDING ANSYS: it is already listed as [App.ansys] in the Engineering category. Once
;  Ansys is installed, open Control Center > APPS > RESCAN (or wait for the daily rescan).
; =====================================================================================

[Layout]
; the two big panels at the top of the side columns (most important categories)
Top1=rocketry
Top2=engineering
; the 8 slots: 1-4 left column (top to bottom), 5-8 right column
Slot1=chrome
Slot2=dev
Slot3=electronics
Slot4=creative
Slot5=explorer
Slot6=comms
Slot7=systools
Slot8=utilities
HideMissing=1

